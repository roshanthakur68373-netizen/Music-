<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#16161f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aa3bff"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff2d75"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="1"/>

  <!-- Sound wave lines -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M18 32 Q24 22 30 32 Q36 42 42 32" opacity="0.6"/>
    <path d="M22 32 Q27 25 32 32 Q37 39 41 32" opacity="0.8"/>
    <path d="M26 32 Q30 28 34 32 Q38 36 40 32" opacity="1" stroke-width="4"/>
  </g>

  <!-- Center play triangle -->
  <polygon points="26,20 26,44 42,32" fill="url(#accentGrad)" filter="url(#glow)"/>
</svg>