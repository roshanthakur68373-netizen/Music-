name: Build Nuosic Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify project
        run: |
          test -f package.json
          node -e "const p=require('./package.json'); if(!p.scripts?.build) throw new Error('Missing build script'); if(!p.dependencies?.['@capacitor/core'] || !p.dependencies?.['@capacitor/android']) throw new Error('Capacitor dependencies missing');"

      - name: Build web app
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android platform
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.js ] && [ ! -f capacitor.config.mjs ]; then
            echo 'Capacitor config not found'; exit 1
          fi
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuosic-music-player-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
